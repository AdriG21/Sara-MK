<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subir archivo .rsc</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <h1>Subir archivo de configuración (.rsc)</h1>
    <form action="/upload" method="POST" enctype="multipart/form-data">
        <label for="file">Selecciona un archivo .rsc:</label>
        <input type="file" name="file" accept=".rsc" required>
        <button type="submit">Subir archivo</button>
    </form>

    {% if result %}
    <h2>Resultado de la auditoría:</h2>
    <pre>{{ result }}</pre>
    {% endif %}
</body>
</html>
